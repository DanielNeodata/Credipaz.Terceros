<form>
    <div class="container-full">
        <h5 class="apiTitle"></h5>
        <p>Devuelve el contenido del archivo requerido dado el <b>token_authentication</b> y <b>id_user_active</b> autenticado.</p>
        <div class="row">
            <div class="col-6 shadow pt-2">
                <table class="table table-borderless hdrEnd"></table>
                <table class="table table-borderless">
                    <thead class="thead-light hdrParam"></thead>
                    <tbody class="bodyParam">
                        <tr>
                            <td><b>DNI</b></td>
                            <td><input class="form-control" id="nroDocumento" name="nroDocumento" type="number" placeholder="DNI" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>Segmento</b></td>
                            <td><input class="form-control" id="segmento" name="segmento" type="text" placeholder="segmento" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>ID request</b></td>
                            <td><input class="form-control" id="idRequest" name="idRequest" type="number" placeholder="Id request" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                        <tr>
                            <td><b>ID transacción</b></td>
                            <td><input class="form-control" id="idTransaccion" name="idTransaccion" type="number" placeholder="Id transacción" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                        <tr>
                            <td><b>ID socio</b></td>
                            <td><input class="form-control" id="idSocio" name="idSocio" type="number" placeholder="Id socio" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="footerEndpoint" style="width:100%;"></div>
            </div>
            <div class="col-6 p-3 shadow areaAjax"></div>
        </div>
    </div>
</form>
