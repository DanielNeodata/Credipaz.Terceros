<form>
    <div class="container-full">
        <h5 class="apiTitle"></h5>
        <p>Obtener los datos de un request, dado el <b>token_authentication</b> y <b>id_user_active</b> autenticado.</p>
        <div class="row">
            <div class="col-6 shadow pt-2">
                <table class="table table-borderless hdrEnd"></table>
                <table class="table table-borderless">
                    <thead class="thead-light hdrParam"></thead>
                    <tbody class="bodyParam">
                        <tr>
                            <td><b>Id request</b></td>
                            <td><input class="form-control" id="idRequest" name="idRequest" type="number" placeholder="Id request" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>End</b></td>
                            <td><input class="form-control" id="end" name="end" type="text" placeholder="Flag para indicar End" value=""/></td>
                            <td style="width:25%;"><i>string</i><p style="font-size:0.6rem;">Valores posibles <b>AK/NAK</b></p></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>IDTX</b></td>
                            <td><input class="form-control" id="idtx" name="idtx" type="text" placeholder="IDTX" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                        <tr>
                            <td><b>Decisión</b></td>
                            <td><input class="form-control" id="decision" name="decision" type="text" placeholder="Decisión" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                        <tr>
                            <td><b>External ID</b></td>
                            <td><input class="form-control" id="externalid" name="externalid" type="text" placeholder="External ID" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="footerEndpoint" style="width:100%;"></div>
            </div>
            <div class="col-6 p-3 shadow areaAjax"></div>
        </div>
    </div>
</form>
