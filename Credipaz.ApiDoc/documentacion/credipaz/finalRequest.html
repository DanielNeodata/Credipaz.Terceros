<form>
    <div class="container-full">
        <h5 class="apiTitle"></h5>
        <p>Operación para finalizar la operación con un request, dado el <b>token_authentication</b> y <b>id_user_active</b> autenticado.</p>
        <div class="row">
            <div class="col-6 shadow pt-2">
                <table class="table table-borderless hdrEnd"></table>
                <table class="table table-borderless">
                    <thead class="thead-light hdrParam"></thead>
                    <tbody class="bodyParam">
                        <tr>
                            <td><b>Id request</b></td>
                            <td><input class="form-control" id="idRequest" name="idRequest" type="number" placeholder="Id request" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>Base64 de la firma</b></td>
                            <td><input class="form-control" id="img_additional" name="img_additional" type="text" placeholder="Base64 de la firma" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>Base64 del PDF de la solicitud</b></td>
                            <td><input class="form-control" id="pdf_solicitud" name="pdf_solicitud" type="text" placeholder="Base64 del PDF de la solicitud" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>Latitud</b></td>
                            <td><input class="form-control onlyNumbers" id="lat" name="lat" type="text" placeholder="Latitud" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>Longitud</b></td>
                            <td><input class="form-control onlyNumbers" id="lng" name="lng" type="text" placeholder="Longitud" value=""/></td>
                            <td><i>string</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="footerEndpoint" style="width:100%;"></div>
            </div>
            <div class="col-6 p-3 shadow areaAjax"></div>
        </div>
    </div>
</form>
