<form>
    <div class="container-full">
        <h5 class="apiTitle"></h5>
        <p>Generar atención espontánea para un socio, dado el <b>token_authentication</b> y <b>id_user_active</b> autenticado.</p>
        <div class="row">
            <div class="col-6 shadow pt-2">
                <table class="table table-borderless hdrEnd"></table>
                <table class="table table-borderless">
                    <thead class="thead-light hdrParam"></thead>
                    <tbody class="bodyParam">
                        <tr>
                            <td><b>Id usuario</b></td>
                            <td><input class="form-control" id="idUser" name="idUser" type="number" placeholder="Id usuario" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-danger">requerido</span></td>
                        </tr>
                        <tr>
                            <td><b>DNI</b></td>
                            <td><input class="form-control" id="dni" name="dni" type="number" placeholder="DNI" value="" autocomplete="new-password" /></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                        <tr>
                            <td><b>Nºde socio Mediya</b></td>
                            <td><input class="form-control" id="idSocio" name="idSocio" type="number" placeholder="Nºde socio Mediya" value=""/></td>
                            <td><i>integer</i></td>
                            <td><span class="badge badge-secondary">opcional</span></td>
                        </tr>
                    </tbody>
                </table>
                <div class="footerEndpoint" style="width:100%;"></div>
            </div>
            <div class="col-6 p-3 shadow areaAjax"></div>
        </div>
    </div>
</form>
<script>
    $("body").off("click", ".btnExec").on("click", ".btnExec", function () {
        var _json = {
            "idUser": $("#idUser").val(),
            "dni": $("#dni").val(),
            "idSocio": $("#idSocio").val(),
        };
        _F.onUiExecute(_json).then(function (data) { });
    });
</script>
